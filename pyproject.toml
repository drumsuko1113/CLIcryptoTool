[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-terminal"
version = "1.0.0"
description = "ETH Trading Terminal - ターミナルベース ETH トレード支援ツール"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.0",
    "rich>=13.7.0",
]

[project.scripts]
eth = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
